<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFCS - Offline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .offline-card {
            background: white;
            border-radius: 1rem;
            padding: 3rem;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .offline-icon {
            font-size: 4rem;
            color: #f59e0b;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">📡</div>
        <h2 class="mb-3">Anda Sedang Offline</h2>
        <p class="text-muted mb-4">
            Tidak dapat terhubung ke server. Pastikan koneksi internet Anda aktif dan coba lagi.
        </p>
        <button onclick="location.reload()" class="btn btn-primary btn-lg">
            <i class="fas fa-sync-alt me-2"></i>Coba Lagi
        </button>
    </div>
</body>
</html>
